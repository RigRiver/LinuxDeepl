# de.rig.LinuxDeepl.yaml
id: de.rig.LinuxDeepl
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: LinuxDeepl

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --filesystem
  - --filesystem=xdg-run/speech-dispatcher:ro
  # Netzwerkzugriff für die DeepL-API
  - --share=network
  # Grafik-Sockets (X11 & Wayland)
  - --socket=fallback-x11
  - --socket=wayland
  # Zugriff auf den Zwischenspeicher für Copy/Paste
  - --share=ipc

modules:
  - name: LinuxDeepl
    buildsystem: cmake-ninja
    # Wichtig: Der Build-Typ muss "Release" sein
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      # "dir" bedeutet: Der Quellcode liegt lokal im selben Ordner
      - type: dir
        path: .
    post-install:
      - install -Dm644 de.rig.LinuxDeepl.desktop /app/share/applications/de.rig.LinuxDeepl.desktop
      - install -Dm644 de.rig.LinuxDeepl.png /app/share/icons/hicolor/512x512/apps/de.rig.LinuxDeepl.png
      - install -Dm644 de.rig.LinuxDeepl.metainfo.xml /app/share/metainfo/de.rig.LinuxDeepl.metainfo.xml
